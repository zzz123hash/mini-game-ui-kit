<header><div class="diff"><button data-n="3" class="on">3×3</button> <button data-n="4">4×4</button> <button data-n="5">5×5</button></div>
<div class="spacer"></div><button class="diff" style="display:contents"><button id="newBtn" style="background:#a8762e;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:14px;cursor:pointer">↻ 重开</button></button></header>
<div id="board"></div>
<div id="win"><div class="box"><h2>🎉 拼好了！</h2><p id="winInfo"></p><button onclick="newGame()">再来一张</button></div></div>
<footer>demo：程序切片（canvas 思路，初期圆角矩形代替经典凹凸边）→ 拖拽吸附 → 完成。正式版接 AI 无限供图管线。</footer>
<script>
let N=3,moves=0,startT=0,timerId=null,locked=0;
const board=document.getElementById('board');
function newGame(){
  document.getElementById('win').style.display='none';
  board.innerHTML='';moves=0;locked=0;
  document.getElementById('moves').textContent='0';
  const W=board.clientWidth,H=board.clientHeight,pw=W/N,ph=H/N;
  const order=[...Array(N*N).keys()].sort(()=>Math.random()-.5);
  for(let i=0;i<N*N;i++){
    const r=Math.floor(i/N),c=i%N;
    const slot=document.createElement('div');slot.className='slot';
    slot.style.cssText=`left:${c*pw}px;top:${r*ph}px;width:${pw}px;height:${ph}px`;
    board.appendChild(slot);
  }
  order.forEach((home,k)=>{
    const hr=Math.floor(home/N),hc=home%N;
    const p=document.createElement('div');p.className='piece';
    const tw=pw,th=ph;
    p.style.cssText=`width:${tw}px;height:${th}px;background-position:-${hc*tw}px -${hr*th}px;`+
      `left:${(k%(N))*(W/N)+(Math.random()*10-5)}px;top:${H+8+Math.floor(k/N)*0}px;`;
    p.style.top=(H- th - 6)+'px';
    p.style.left=((k%N)*(W/N)+(W/N-tw)/2)+'px';
    // scatter below board: place in a tray row under board via fixed offsets
    p.dataset.hr=hr;p.dataset.hc=hc;
    board.appendChild(p);
    drag(p,tw,th,W,H,pw,ph);
  });
  startT=Date.now();clearInterval(timerId);
  timerId=setInterval(()=>{const s=Math.floor((Date.now()-startT)/1000);
    document.getElementById('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');},500);
}
function drag(p,tw,th,W,H,pw,ph){
  let sx,sy,ox,oy;
  p.addEventListener('pointerdown',e=>{
    if(p.classList.contains('lock'))return;
    p.setPointerCapture(e.pointerId);
    sx=e.clientX;sy=e.clientY;ox=p.offsetLeft;oy=p.offsetTop;
    p.style.zIndex=10;
    const mv=ev=>{
      p.style.left=(ox+ev.clientX-sx)+'px';
      p.style.top=(oy+ev.clientY-sy)+'px';
    };
    const up=ev=>{
      p.removeEventListener('pointermove',mv);p.removeEventListener('pointerup',up);
      moves++;document.getElementById('moves').textContent=moves;
      const hx=p.dataset.hc*pw,hy=p.dataset.hr*ph;
      const cx=p.offsetLeft+tw/2,cy=p.offsetTop+th/2;
      if(Math.hypot(cx-(hx+pw/2),cy-(hy+ph/2))<Math.min(pw,ph)*0.45){
        p.style.left=hx+'px';p.style.top=hy+'px';p.classList.add('lock');p.style.zIndex=2;locked++;
        if(locked===N*N){clearInterval(timerId);
          setTimeout(()=>{document.getElementById('winInfo').textContent=`${N}×${N} · ${moves} 步 · ${document.getElementById('timer').textContent}`;
            document.getElementById('win').style.display='flex';},400);}
      }else p.style.zIndex=5;
    };
    p.addEventListener('pointermove',mv);p.addEventListener('pointerup',up);
  });
}
document.querySelectorAll('.diff button[data-n]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.diff button[data-n]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');N=+b.dataset.n;newGame();});
document.getElementById('newBtn').onclick=newGame;
window.addEventListener('load',newGame);
</script>
</body>
</html>
